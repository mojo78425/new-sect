<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagos Weather App</title>
</head>

<body>

    <h1>Lagos Weather App 🌤️</h1>

    <h2>Current Weather</h2>

    <p id="temperature">Loading temperature...</p>
    <p id="humidity">Loading humidity...</p>
    <p id="wind">Loading wind speed...</p>

    <button onclick="getWeather()">Refresh Weather</button>

    <p id="error"></p>

    <p>
        Weather data by
        <a href="https://open-meteo.com/">Open-Meteo</a>
    </p>

    <script>

        // 1. Store the API URL
        const apiURL =
            "https://api.open-meteo.com/v1/forecast?latitude=6.5244&longitude=3.3792&current=temperature_2m,relative_humidity_2m,wind_speed_10m&timezone=Africa%2FLagos";

        // 2. Create the weather function
        async function getWeather() {

            try {

                // 3. Request weather data
                const response = await fetch(apiURL);

                if (!response.ok) {
                    throw new Error("Weather request failed");
                }

                // 4. Convert response into JSON
                const data = await response.json();

                // 5. Get current weather information
                const current = data.current;

                // 6. Display the weather on the webpage
                document.querySelector("#temperature").textContent =
                    "Temperature: " + current.temperature_2m + "°C";

                document.querySelector("#humidity").textContent =
                    "Humidity: " + current.relative_humidity_2m + "%";

                document.querySelector("#wind").textContent =
                    "Wind Speed: " + current.wind_speed_10m + " km/h";

                document.querySelector("#error").textContent = "";

            } catch (error) {

                document.querySelector("#error").textContent =
                    "Unable to load weather. Check your internet connection.";

                console.error(error);

            }

        }

        // 7. Load weather when the page opens
        getWeather();

    </script>

</body>

</html>
